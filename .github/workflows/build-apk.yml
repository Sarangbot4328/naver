name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare signing key directory
        run: mkdir -p /home/runner/.android

      - name: Restore the same debug signing key
        id: signing-key-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: webtoon-map-debug-keystore-v1

      - name: Create a signing key only when none was restored
        run: |
          if [ ! -f /home/runner/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore /home/runner/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Show signing key cache result
        run: |
          echo "Signing key cache hit: ${{ steps.signing-key-cache.outputs.cache-hit }}"
          keytool -list -v \
            -keystore /home/runner/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey |
          grep -E "SHA1:|SHA256:"

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/webtoon-map.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: webtoon-map-apk
          path: app/build/outputs/apk/debug/webtoon-map.apk
          if-no-files-found: error

